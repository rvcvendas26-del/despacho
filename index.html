<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Leitor Despacho Krates</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0b0f0e;color:#fff;padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px)}
  h1{font-size:19px;margin:12px 0 8px;display:flex;justify-content:space-between;align-items:center}
  h1 b{font-size:26px;color:#4ade80}
  #reader{width:100%;border-radius:14px;overflow:hidden;background:#000}
  #reader video{border-radius:14px}
  #msg{margin:10px 0;padding:12px;border-radius:12px;background:#1f2937;font-weight:800;font-size:16px;text-align:center;min-height:46px}
  #msg.ok{background:#16a34a}#msg.rep{background:#ca8a04}#msg.bad{background:#dc2626}
  ul{list-style:none;padding:0;margin:0 0 12px}
  li{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid #1f2937;font-size:16px;font-family:ui-monospace,monospace}
  li button{background:none;border:0;color:#f87171;font-size:20px}
  .btn{display:block;width:100%;padding:16px;border:0;border-radius:14px;font-size:18px;font-weight:900;margin-top:8px}
  #enviar{background:#16a34a;color:#fff}#enviar:disabled{opacity:.4}
  #limpar{background:#1f2937;color:#fff}
  #iniciar{background:#16a34a;color:#fff}
  #card{display:none;position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 10px);z-index:50;padding:18px;border-radius:18px;font-size:20px;font-weight:900;line-height:1.3;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #card .bts{display:flex;gap:8px;margin-top:12px}
  #card .bts button{flex:1;padding:16px 8px;border:0;border-radius:12px;font-size:18px;font-weight:900}
  #card .bc{background:rgba(255,255,255,.95);color:#111}
  #card .bl{background:#052e16;color:#fff;border:2px solid #fff!important}
  #card small{display:block;color:#fff;opacity:.9;font-size:15px;font-weight:700;margin-top:6px}
  .c-ok{background:#16a34a}.c-ant{background:#ea580c}.c-fut{background:#2563eb}.c-atr{background:#dc2626}.c-rep{background:#ca8a04}.c-nao{background:#4b5563}
  #resumo{margin:8px 0 0;padding:10px 12px;border-radius:12px;background:#111827;font-size:15px;font-weight:700}
  li .tag{font-family:-apple-system,system-ui,sans-serif;font-size:13px;font-weight:800;padding:3px 8px;border-radius:8px;margin-left:6px}
  small{color:#9ca3af;display:block;margin-top:10px;font-size:12px}
</style>
</head>
<body>
<h1>🚚 Leitor do despacho <b id="cont">0</b></h1>
<div id="card"></div>
<div id="reader"></div>
<div id="resumo"></div>
<button class="btn" id="iniciar" style="display:none">📷 Ligar câmera</button>
<div id="msg">Aponte a câmera para o código de barras da etiqueta</div>
<ul id="lista"></ul>
<button class="btn" id="enviar" disabled>✅ Enviar para o painel</button>
<button class="btn" id="limpar">Limpar lista</button>
<small>A cada etiqueta: 🔍 Só consulta (só vê o status) ou ✅ Lançar (vai para a lista). No fim, toque uma vez em "Enviar para o painel" para subir os lançados.</small>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const PAINEL='https://claude.ai/artifact/4Nj3o1GCo7X14Q2PK3FyJB';
let cods=[]; try{ cods=JSON.parse(localStorage.getItem('krCods')||'[]'); }catch(e){}
let ultimo='', ultimoT=0, ctx=null, cardT=0;
let D=null; try{ D=JSON.parse(localStorage.getItem('krDados')||'null'); }catch(e){}
try{ const m=location.hash.match(/^#d=(.+)$/); if(m){ D=JSON.parse(decodeURIComponent(m[1])); localStorage.setItem('krDados',JSON.stringify(D)); history.replaceState(null,'',location.pathname); } }catch(e){}
let INFO={}; try{ INFO=JSON.parse(localStorage.getItem('krInfo')||'{}'); }catch(e){}
const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const hoje=()=>new Date(Date.now()-3*3600e3).toISOString().slice(0,10);
const amanha=()=>new Date(Date.now()-3*3600e3+864e5).toISOString().slice(0,10);
const SEM=['dom','seg','ter','qua','qui','sex','sáb'];
const dia=iso=>{ if(!iso||iso>'9990') return 'sem data'; const d=new Date(iso+'T12:00:00'); return SEM[d.getDay()]+' '+iso.slice(8,10)+'/'+iso.slice(5,7); };
const hhmm=t=>new Date(t-3*3600e3).toISOString().slice(11,16);
function achar(cod){ if(!D||!D.p) return null; const c=norm(cod); for(const p of D.p){ const cs=String(p[0]).split('.').filter(Boolean); if(cs.some(x=>x===c||(x.length>=8&&(c.includes(x)||x.includes(c))))) return p; } return null; }
function status(cod){
  if(!D) return {c:'nao',t:'Leitor sem a lista de pedidos',s:'Abra o leitor pelo botão 📷 do painel para ele saber o status de cada etiqueta.'};
  const p=achar(cod); if(!p) return {c:'nao',t:'📦 Marcos, essa etiqueta não está nos pedidos a despachar',s:'Provavelmente já foi postada. Se for pedido novo, atualize o painel.'};
  const [cs,nome,plat,pz,scan,sac]=p, quem=nome+' · '+plat+' #'+sac;
  if(scan) return {c:'rep',t:'⚠️ Esse já foi conferido às '+hhmm(scan),s:quem+' · despacho '+dia(pz)};
  const h=hoje();
  if(pz<h) return {c:'atr',t:'⛔ ATRASADO! Era para '+dia(pz)+'. Despache agora!',s:quem};
  if(pz===h) return {c:'ok',t:'✅ Marcos, é de HOJE! Parabéns, vai no despacho de hoje',s:quem};
  if(pz===amanha()) return {c:'ant',t:'🟠 Essa é para AMANHÃ ('+dia(pz)+')',s:quem+' · pode antecipar'};
  return {c:'fut',t:'🔵 Essa é para '+dia(pz),s:quem+' · ainda não é hora'};
}
let ESPERA=null;
function fecharCard(){ $('card').style.display='none'; ESPERA=null; ultimoT=Date.now(); }
function mostrar(st,cod){ const c=$('card'); c.className='c-'+st.c; clearTimeout(cardT);
  const podeLancar=cod&&(st.c==='ok'||st.c==='ant'||st.c==='fut'||st.c==='atr');
  c.innerHTML=st.t+'<small>'+st.s+'</small>'+(podeLancar?'<div class="bts"><button class="bc" id="bCons">🔍 Só consulta</button><button class="bl" id="bLanc">✅ Lançar</button></div>':'<div class="bts"><button class="bc" id="bOk">OK</button></div>');
  c.style.display='block'; ESPERA=cod||'x';
  if(podeLancar){ $('bCons').onclick=()=>{ fecharCard(); msg('🔍 Consultado: '+cod); }; $('bLanc').onclick=()=>{ INFO[cod]=st.c; try{ localStorage.setItem('krInfo',JSON.stringify(INFO)); }catch(e){} cods.push(cod); salvar(); desenhar(); fecharCard(); msg('✅ Lançado: '+(achar(cod)||[0,cod])[1],'ok'); bip(true); }; }
  else { $('bOk').onclick=fecharCard; } }
function resumo(){ const r=$('resumo'); if(!D){ r.textContent='⚠️ Abra pelo botão 📷 do painel para ver o status dos pedidos.'; return; }
  const h=hoje(), lidos=new Set(cods.map(c=>{ const p=achar(c); return p&&p[0]; }).filter(Boolean));
  const deHoje=D.p.filter(p=>p[3]<=h), feitos=deHoje.filter(p=>p[4]||lidos.has(p[0]));
  r.innerHTML='🚚 Hoje: <b>'+feitos.length+' de '+deHoje.length+'</b> conferidos'+(deHoje.length-feitos.length?' · faltam <b>'+(deHoje.length-feitos.length)+'</b>':' 🎉')+'<br><span style="color:#9ca3af;font-size:12px">Lista do painel de '+hhmm(D.t)+'</span>'; }
function salvar(){ try{ localStorage.setItem('krCods',JSON.stringify(cods)); }catch(e){} }
function msg(t,c){ const m=$('msg'); m.textContent=t; m.className=c||''; }
function bipLeitura(){ try{ ctx=ctx||new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(), g=ctx.createGain(); o.type='square'; o.frequency.value=2600; g.gain.value=.12; o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+.08); }catch(e){} try{ navigator.vibrate&&navigator.vibrate(40); }catch(e){} }
function bip(ok){ try{ ctx=ctx||new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=ok?1500:300; g.gain.value=.25; o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+(ok?.12:.35)); }catch(e){} try{ navigator.vibrate&&navigator.vibrate(ok?80:[80,60,80]); }catch(e){} }
function desenhar(){
  $('cont').textContent=cods.length;
  const cor={ok:'#16a34a',ant:'#ea580c',fut:'#2563eb',atr:'#dc2626',rep:'#ca8a04',nao:'#4b5563'}, rot={ok:'hoje',ant:'amanhã',fut:'depois',atr:'atrasado',rep:'já conferido',nao:'não achado'};
  $('lista').innerHTML=cods.map((c,i)=>{ const st=INFO[c]||'nao', p=achar(c); return '<li><span>'+(i+1)+'. '+(p?p[1]:c)+'<span class="tag" style="background:'+cor[st]+'">'+rot[st]+'</span></span><button data-i="'+i+'">✕</button></li>'; }).reverse().join('');
  resumo();
  $('enviar').disabled=!cods.length; $('enviar').textContent='✅ Enviar para o painel'+(cods.length?' ('+cods.length+')':'');
}
$('lista').onclick=e=>{ const i=e.target.dataset.i; if(i!==undefined){ cods.splice(+i,1); salvar(); desenhar(); } };
function lido(txt){
  if(ESPERA) return;
  const c=String(txt||'').trim().replace(/\s+/g,'');
  const agora=Date.now(); if(c===ultimo && agora-ultimoT<6000) return; ultimo=c; ultimoT=agora;
  bipLeitura();
  if(!/^[A-Za-z0-9]{6,40}$/.test(c)){ msg('Esse código não é de etiqueta. Mire no código de barras.','bad'); return; }
  if(cods.includes(c)){ mostrar({c:'rep',t:'⚠️ Você já lançou essa agora',s:(achar(c)||[0,c])[1]}); return; }
  const st=status(c); setTimeout(()=>bip(st.c==='ok'||st.c==='ant'||st.c==='fut'),150); mostrar(st,c);
}
$('enviar').onclick=()=>{ if(!cods.length) return; const h='scan-'+Date.now()+'-'+cods.join('-'); cods=[]; salvar(); desenhar(); location.href=PAINEL+'#'+h; };
$('limpar').onclick=()=>{ cods=[]; salvar(); desenhar(); msg('Lista limpa. Pode bipar.'); };

const F=Html5QrcodeSupportedFormats;
const leitor=new Html5Qrcode('reader',{formatsToSupport:[F.CODE_128,F.CODE_39,F.CODE_93,F.EAN_13,F.EAN_8,F.ITF,F.UPC_A,F.QR_CODE],experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
function ligar(){
  $('iniciar').style.display='none';
  leitor.start({facingMode:'environment'},{fps:15,qrbox:(w,h)=>({width:Math.floor(w*0.88),height:Math.max(70,Math.floor(w*0.3))}),aspectRatio:0.5625,disableFlip:true},lido,()=>{})
    .catch(()=>{ msg('Libere a câmera para o Safari e toque em "Ligar câmera".','bad'); $('iniciar').style.display='block'; });
}
$('iniciar').onclick=ligar;
desenhar(); ligar();
</script>
</body>
</html>
